# Jarvis settings. The installer copies this file to ~/.config/jarvis/config.toml
# After editing it, restart Jarvis:  systemctl --user restart jarvis

[user]
# How Jarvis calls you (leave empty for "the user")
name = ""

[language]
# "auto" = Jarvis answers in the language you speak.
# Or force a language, e.g. "English" or "Spanish".
reply = "auto"
# Language practice mode: if `reply` is a fixed language and you speak in this
# language, Jarvis first tells you how to say your sentence in `reply`.
# Example: reply = "English", tutor = "Spanish"
tutor = ""

[voice]
# "kokoro" = local voice, fast and offline (recommended)
# "edge"   = Microsoft Edge online voices (many languages, slower, needs internet)
engine = "kokoro"
# Kokoro voices: am_onyx, am_michael, am_fenrir, am_puck, am_liam, af_heart, af_bella,
# bm_george, bf_emma, ... Join several with "+" to blend them.
kokoro_voice = "am_onyx+am_michael"
kokoro_speed = 1.15
# 0 = normal pitch, 0.08 = 8% deeper (a "butler" voice)
kokoro_deepen = 0.08
# Kokoro language: "en-us", "en-gb", "es", "fr-fr", "it", "pt-br", "hi", "ja", "zh"
kokoro_lang = "en-us"
# Edge voice (used when engine = "edge", and as a fallback)
edge_voice = "en-US-AndrewMultilingualNeural"

[phrases]
greeting = "Yes? What can I do for you?"
goodbye = "You're welcome. I'll be here if you need me."
timeout = "I'll be here if you need me."
# Said once when Claude starts working on your PC (running commands, reading files)
# before it has said anything, so there is no long silence. "" = stay silent.
working = "One moment, I'm checking that."
# Answers to the voice commands "activate terminal" / "deactivate terminal"
terminal_on = "Terminal activated. I'll show you every command I run."
terminal_off = "Terminal deactivated. I'll keep working in the background."

[claude]
# Claude model alias used by Claude Code: "sonnet" is fast for voice, "opus" is smarter
model = "sonnet"
# Claude Code permission mode. "auto" lets Claude Code's safety classifier decide
# what is allowed. Avoid "bypassPermissions": anyone near your microphone could
# ask Jarvis to do anything.
permission_mode = "auto"
timeout = 300
# Tools Claude may use. Each tool's description is sent with every request, so
# fewer tools = fewer tokens per question: with these 8, a question that runs a
# command costs ~22k tokens instead of ~100k with Claude Code's full set.
# "default" = every built-in tool.
tools = "Bash,Read,Write,Edit,Glob,Grep,WebFetch,WebSearch"
# true = also load your Claude Code MCP servers, skills and slash commands
# (more tokens per question; only if you want Jarvis to use them).
extensions = false

[stt]
# How your voice becomes text:
#   "local" = Whisper on this computer (private, offline, no account). Fast on an
#             NVIDIA GPU; on CPU only, use local_model = "small" for speed.
#   "groq"  = Groq's free online API (needs ~/.config/jarvis/groq_key).
# The installer asks you which one to use. If "local" fails and a Groq key exists,
# Jarvis falls back to Groq.
engine = "groq"
local_model = "large-v3-turbo"
device = "auto"        # "auto", "cuda" or "cpu"
compute_type = "auto"  # "auto" = int8_float16 on GPU (about 1.3 GB of VRAM), int8 on CPU
language = ""          # "" = detect automatically, or force one, e.g. "en"
# The model loads when you say "Hey Jarvis" (while Jarvis greets you) and is freed
# this many seconds after the conversation, so a sleeping Jarvis uses no VRAM.
# -1 keeps it loaded all the time (no loading wait, but the VRAM stays busy).
unload_after = 60
# Gaming mode: while ~/.local/state/jarvis/gaming_mode exists, Whisper runs on the
# CPU with this smaller model and the GPU stays free for games. Ask Jarvis to
# "turn on gaming mode", or: touch ~/.local/state/jarvis/gaming_mode
gaming_model = "small"

[memory]
# Jarvis remembers your conversations.
enabled = true
# Wake him up within this many hours and he continues the same conversation.
resume_hours = 12
# When the conversation gets bigger than this (in tokens), Jarvis summarizes it
# after you say goodbye and starts fresh with that summary as memory.
# This keeps answers fast and saves your Claude usage.
max_context_tokens = 60000
summary_model = "haiku"
# To make Jarvis forget everything, delete ~/.local/state/jarvis/memory.json

[wake]
# Minimum score (0 to 1) to accept "Hey Jarvis". Raise it if Jarvis wakes up by mistake.
threshold = 0.5
# How many 80 ms chunks in a row must reach `threshold`. A real "Hey Jarvis" keeps a
# high score for several chunks; a similar sound in a video usually lasts only one.
# 1 = wake on a single chunk (most sensitive). Raise it to 3 if videos still wake him.
# The log shows "Near miss: wake score ..." for sounds that almost woke him up.
patience = 2
# Stricter threshold used while a video or music is playing (YouTube, Netflix,
# Spotify, VLC... anything that shows media controls). Needs `playerctl`; without
# it, `threshold` is always used. 0 = off.
media_threshold = 0.8

[listening]
wait_for_speech = 10.0   # seconds Jarvis waits for you to start talking
end_silence = 2.0        # seconds of silence that end your sentence (raise it if you
                         # pause a lot to think, lower it for faster replies)
max_utterance = 60.0     # maximum length of one request, in seconds
continue_wait = 4.0      # if your sentence ends like "...and", "...because", "um",
                         # Jarvis waits this long for you to finish it

[interrupt]
# How to cut Jarvis off while he is talking:
#   "voice"    = just start talking (best with a headset)
#   "wakeword" = say "Hey Jarvis" (safer with speakers, so Jarvis can't interrupt himself)
#   "off"      = only by clicking the orb
mode = "voice"
min_speech = 0.30     # seconds of your voice needed to interrupt (ignores coughs)
vad_threshold = 0.50  # how sure it must be that it's a human voice (0 to 1)

[ui]
# Show the window when Jarvis starts (otherwise it appears when you wake it up)
show_on_start = false

[activity]
# See what Jarvis does on your computer: when Claude runs its first command, a
# terminal window opens and shows every command and its output, live. The same
# window is used for the rest of the conversation and closes when Jarvis goes back
# to sleep. Everything is also saved in ~/.local/state/jarvis/activity.log
# Say "deactivate terminal" or "activate terminal" to change it by voice (that
# choice is remembered in ~/.local/state/jarvis/activity_terminal and wins over this).
show_terminal = true
# "auto" finds your terminal app (COSMIC Terminal, GNOME Terminal, Konsole...).
# Or give a command that runs what follows it and stays open with its window,
# e.g. "gnome-terminal --wait --" or "kitty".
terminal = "auto"
